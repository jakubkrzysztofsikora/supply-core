name: Guardrails

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-suite-armed:
    # Dead-man's switch: while HOSTED_SUITE_ENABLED is false, the full test
    # suite, docker-engine test and the 85% coverage floor are NOT enforced.
    # (Runner health needs admin scope, so it is watched by the Mac supervisor
    # instead — see sc-ephemeral-supervisor.sh.)
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ vars.HOSTED_SUITE_ENABLED }}" != "true" ]; then
            echo "::error::HOSTED_SUITE_ENABLED is not 'true': full suite, docker-engine test and 85% coverage floor are unenforced. Restore GitHub billing, then set the repo variable."
            exit 1
          fi

name: CI
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  pull_request:
  push:
    branches: [ main, work ]
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
    runs-on: [self-hosted, supply-core-linux]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: python3 -m unittest discover -s experiments -p 'test_*.py'
      - run: cargo clippy --locked --all-targets -- -D warnings
  docker-engine:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Billing gate notice
        run: echo "::warning::docker-engine uses hosted runners; failure is expected until GitHub billing is restored. Flip continue-on-error off once billing works."
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - run: cargo test --locked docker_engine_cannot_pull_until_release -- --ignored
  coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
    runs-on: [self-hosted, supply-core-linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: llvm-tools-preview
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: cargo llvm-cov --locked --fail-under-lines 85 --summary-only
  registry-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, supply-core-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - run: cargo test --locked --test e2e_npm -- --ignored --test-threads=1

name: CI
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  pull_request:
  push:
    branches: [ main, work ]
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
    runs-on: [self-hosted, supply-core-linux]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # Sandbox-dependent tests carry #[ignore = "requires bubblewrap sandbox…"]
      # so the plain run excludes them here; hosted-suite re-enables them.
      - run: cargo test --locked
      - run: python3 -m unittest discover -s experiments -p 'test_*.py'
      - run: cargo clippy --locked --all-targets -- -D warnings
  hosted-suite:
    # Billing lock blocks hosted runners; flip repo variable HOSTED_SUITE_ENABLED
    # to 'true' once billing is restored — full suite becomes blocking again.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true) && vars.HOSTED_SUITE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: llvm-tools-preview
      - run: cargo test --locked -- --include-ignored --skip e2e_
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      # --include-ignored keeps the 85% floor calibrated on the full suite
      # (sandbox tests included); e2e_ npm tests stay schedule-only.
      - run: cargo llvm-cov --locked --fail-under-lines 85 --summary-only -- --include-ignored --skip e2e_
  coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
    runs-on: [self-hosted, supply-core-linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: llvm-tools-preview
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      # Sandbox-dependent engine code is unexercised without bubblewrap, so this
      # lane's floor tracks the no-sandbox baseline (measured 81.96% vs 82.52%
      # on macOS); the 85% repo floor applies on the hosted-suite job.
      - run: cargo llvm-cov --locked --fail-under-lines 81 --summary-only
  registry-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, supply-core-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - run: cargo test --locked --test e2e_npm -- --ignored --test-threads=1

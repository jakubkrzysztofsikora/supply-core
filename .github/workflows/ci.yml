name: CI
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  pull_request:
  push:
    branches: [ main, work ]
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
    runs-on: [self-hosted, supply-core-linux]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # command_scanner sandbox tests plus the external-scanner CLI test need
      # bubblewrap user namespaces, which this host's LXC forbids inside any
      # container. They run in the hosted-suite job when billing is restored.
      - run: cargo test --locked -- --skip guarddog_report_is_complete --skip invalid_json_report_is_partial --skip clean_command_reports_no_findings --skip package_scan_records_external_scanner_finding
      - run: python3 -m unittest discover -s experiments -p 'test_*.py'
      - run: cargo clippy --locked --all-targets -- -D warnings
  hosted-suite:
    # Billing lock blocks hosted runners; flip repo variable HOSTED_SUITE_ENABLED
    # to 'true' once billing is restored — full suite becomes blocking again.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true) && vars.HOSTED_SUITE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - run: cargo test --locked
      - run: cargo test --locked docker_engine_cannot_pull_until_release -- --ignored
  coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
    runs-on: [self-hosted, supply-core-linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: llvm-tools-preview
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: cargo llvm-cov --locked --fail-under-lines 85 --summary-only -- --skip guarddog_report_is_complete --skip invalid_json_report_is_partial --skip clean_command_reports_no_findings --skip package_scan_records_external_scanner_finding
  registry-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, supply-core-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - run: cargo test --locked --test e2e_npm -- --ignored --test-threads=1

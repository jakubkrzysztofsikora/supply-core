services:
  supply-core:
    image: ghcr.io/jakubkrzysztofsikora/supply-core:v0.2.3
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: supply-core
    restart: unless-stopped
    ports:
      - "4873:4873"
    environment:
      - SUPPLY_SERVICE_NAME=supply-core-selfhosted
      - SUPPLY_STATUS_FILE=/app/data/quarantine-status.json
      - SUPPLY_AUTH_TOKEN=${SUPPLY_AUTH_TOKEN:-}
      - PORT=4873
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4873/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  radar:
    image: ghcr.io/jakubkrzysztofsikora/supply-core-radar:v0.2.3
    build:
      context: .
      dockerfile: Dockerfile
      target: radar
    container_name: supply-core-radar
    profiles: ["radar"]
    restart: unless-stopped
    depends_on:
      supply-core:
        condition: service_healthy
    environment:
      - SUPPLY_STATUS_URL=http://supply-core:4873
      - SUPPLY_STATUS_AUTH_TOKEN=${SUPPLY_AUTH_TOKEN:-}
      - SUPPLY_INTERVAL_SECONDS=${SUPPLY_INTERVAL_SECONDS:-86400}
    volumes:
      - ./radar:/radar-config:ro
      - ./radar/data:/radar/data
      - ${SUPPLY_WORKSPACE:-./workspace}:/workspace:ro

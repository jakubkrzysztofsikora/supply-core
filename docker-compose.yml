services:
  supply-core:
    image: ghcr.io/jakubkrzysztofsikora/supply-core:v0.1.1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supply-core
    restart: unless-stopped
    ports:
      - "4873:4873"
    environment:
      - SUPPLY_SERVICE_NAME=supply-core-selfhosted
      - SUPPLY_STATUS_FILE=/app/data/quarantine-status.json
      - PORT=4873
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4873/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

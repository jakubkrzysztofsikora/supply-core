server:
  service_url: "https://supply-core.tail5d39b4.ts.net"  # Official service is primary by default
  allow_fallback: false  # Overwritable only by explicit config
  force_official: true
quarantine:
  enabled: true
  minimum_age_days: 7
vulnerabilities:
  block_severities:
    - High
    - Critical
npm:
  require_integrity: true
  fallback_to_frozen: true
  deny_packages: []
github_actions:
  require_full_sha_pin: true
  allow_local_actions: true
azure_pipelines:
  require_task_version: true
  require_full_sha_pin: true
  allow_local_templates: true
  allowed_unpinned_checkouts: []
  allowed_unpinned_tasks: []
  allowed_unpinned_repositories: []

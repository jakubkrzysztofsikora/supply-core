apiVersion: apps/v1
kind: Deployment
metadata:
  name: supply-core-official
  namespace: supply-core
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: supply-core-official
  template:
    metadata:
      labels:
        app: supply-core-official
    spec:
      containers:
      - name: app
        image: ghcr.io/jakubkrzysztofsikora/supply-core:v0.2.1
        imagePullPolicy: Always
        ports:
        - containerPort: 4873
          name: http
        env:
        - name: SUPPLY_SERVICE_NAME
          value: "supply-core-official"
        - name: SUPPLY_ARTIFACTS_DIR
          value: "/app/artifacts"
        - name: SUPPLY_STATUS_FILE
          value: "/app/artifacts/quarantine-status.json"
        - name: SUPPLY_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: supply-core-auth
              key: SUPPLY_AUTH_TOKEN
        - name: PORT
          value: "4873"
        - name: HOST
          value: "127.0.0.1"
        volumeMounts:
        - name: artifacts
          mountPath: /app/artifacts
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 4873
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 4873
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
        startupProbe:
          httpGet:
            path: /health
            port: 4873
          periodSeconds: 2
          failureThreshold: 30
          timeoutSeconds: 3
      - name: ts-funnel
        image: tailscale/tailscale@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: ts-sidecar-auth
              key: TS_AUTHKEY
        - name: TS_HOSTNAME
          value: supply-core
        - name: TS_USERSPACE
          value: "true"
        - name: TS_SERVE_CONFIG
          value: /config/serve.json
        - name: TS_STATE_DIR
          value: /var/lib/tailscale
        - name: TS_KUBE_SECRET
          value: ""
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: state
          mountPath: /var/lib/tailscale
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 128Mi
      volumes:
      - name: artifacts
        persistentVolumeClaim:
          claimName: supply-core-artifacts
      - name: config
        configMap:
          name: ts-funnel-config
      - name: state
        persistentVolumeClaim:
          claimName: ts-funnel-state

apiVersion: apps/v1
kind: Deployment
metadata:
  name: supply-core-official
  namespace: supply-core
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: supply-core-official
  template:
    metadata:
      labels:
        app: supply-core-official
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-node-1
      tolerations:
      - key: lustro.io/pool
        operator: Equal
        value: worker
        effect: NoExecute
      initContainers:
      - name: docker-mirror-volume-owner
        image: ghcr.io/jakubkrzysztofsikora/supply-core:v0.5.0@sha256:2a2f1cdf005eb2dc1f6684e2b074b857bcc99510b69a04fa3a6c7d8d04f11987
        imagePullPolicy: IfNotPresent
        # Secret projections are root-owned symlinks (unreadable by the app's
        # regular-file reader); copy them into a private emptyDir as real
        # owner-readable files.
        command: ["sh", "-ec", "mkdir -p /app/artifacts/detonations /run/detonation-secrets && cp -L /app/secrets-src/detonation-ingest-token /app/secrets-src/detonation-ingest-keys.json /run/detonation-secrets/ && chown supply:supply /app/docker-mirror /app/artifacts/detonations /run/detonation-secrets /run/detonation-secrets/detonation-ingest-token /run/detonation-secrets/detonation-ingest-keys.json && chmod 700 /app/docker-mirror /app/artifacts/detonations /run/detonation-secrets && chmod 600 /run/detonation-secrets/detonation-ingest-token /run/detonation-secrets/detonation-ingest-keys.json"]
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: docker-mirror
          mountPath: /app/docker-mirror
        - name: artifacts
          mountPath: /app/artifacts
        - name: detonation-ingest
          mountPath: /app/secrets-src
          readOnly: true
        - name: detonation-runtime
          mountPath: /run/detonation-secrets
      containers:
      - name: app
        image: ghcr.io/jakubkrzysztofsikora/supply-core:v0.5.0@sha256:2a2f1cdf005eb2dc1f6684e2b074b857bcc99510b69a04fa3a6c7d8d04f11987
        imagePullPolicy: Always
        ports:
        - containerPort: 4873
          name: http
        env:
        # Public Hub pulls use anonymous Docker Hub rate limits.
        - name: SUPPLY_DOCKER_MIRROR_ENABLED
          value: "true"
        - name: SUPPLY_DETONATION_ROUTES_ENABLED
          value: "1"
        - name: SUPPLY_DETONATION_PUBLIC_STORE
          value: "/app/artifacts/detonations"
        - name: SUPPLY_DETONATION_INGEST_TOKEN_FILE
          value: "/run/detonation-secrets/detonation-ingest-token"
        - name: SUPPLY_DETONATION_INGEST_KEYS_FILE
          value: "/run/detonation-secrets/detonation-ingest-keys.json"
        - name: SUPPLY_SERVICE_NAME
          value: "supply-core-official"
        - name: SUPPLY_ARTIFACTS_DIR
          value: "/app/artifacts"
        - name: SUPPLY_STATUS_FILE
          value: "/app/artifacts/quarantine-status.json"
        - name: SUPPLY_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: supply-core-auth
              key: SUPPLY_AUTH_TOKEN
        - name: PORT
          value: "4873"
        - name: HOST
          value: "127.0.0.1"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: docker-mirror
          mountPath: /app/docker-mirror
        - name: artifacts
          mountPath: /app/artifacts
        - name: detonation-runtime
          mountPath: /run/detonation-secrets
          readOnly: true
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /health
            port: 4873
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 4873
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
        startupProbe:
          httpGet:
            path: /health
            port: 4873
          periodSeconds: 2
          failureThreshold: 30
          timeoutSeconds: 3
      - name: ts-funnel
        image: tailscale/tailscale@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: ts-sidecar-auth
              key: TS_AUTHKEY
        - name: TS_HOSTNAME
          value: supply-core
        - name: TS_USERSPACE
          value: "true"
        - name: TS_SERVE_CONFIG
          value: /config/serve.json
        - name: TS_STATE_DIR
          value: /var/lib/tailscale
        - name: TS_KUBE_SECRET
          value: ""
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: state
          mountPath: /var/lib/tailscale
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 128Mi
      volumes:
      - name: artifacts
        persistentVolumeClaim:
          claimName: supply-core-artifacts
      - name: docker-mirror
        persistentVolumeClaim:
          claimName: supply-core-docker-mirror
      - name: detonation-ingest
        secret:
          secretName: supply-core-detonation-ingest
          defaultMode: 0400
      - name: detonation-runtime
        emptyDir:
          medium: Memory
      - name: config
        configMap:
          name: ts-funnel-config
      - name: state
        persistentVolumeClaim:
          claimName: ts-funnel-state

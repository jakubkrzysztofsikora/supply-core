apiVersion: v1
kind: ConfigMap
metadata:
  name: ts-funnel-config
  namespace: supply-core
data:
  serve.json: |
    {
      "TCP": {"443": {"HTTPS": true}},
      "Web": {"${TS_CERT_DOMAIN}:443": {"Handlers": {"/": {"Proxy": "http://127.0.0.1:4873"}}}},
      "AllowFunnel": {"${TS_CERT_DOMAIN}:443": true}
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ts-funnel-state
  namespace: supply-core
spec:
  accessModes: [ReadWriteOnce]
  # storageClassName: <your-storage-class>  # defaults to the cluster default
  resources:
    requests:
      storage: 128Mi
